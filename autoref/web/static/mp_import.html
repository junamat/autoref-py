<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>autoref — mp import</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { overflow-y: auto; height: auto; min-height: 100vh; }
  .mi-page { max-width: 600px; margin: 0 auto; padding: 2rem 1rem; }
  .mi-topbar { display:flex; align-items:center; gap:1rem; margin-bottom:2rem; flex-wrap:wrap; }

  .mi-section { margin-bottom: 1.5rem; }
  .mi-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }

  .mi-input { background: var(--head); color: var(--text); border: 1.5px solid var(--border); border-radius: 3px; padding: 8px 12px; font-family: inherit; font-size: 12px; width: 100%; box-sizing: border-box; }
  .mi-input:focus { outline: none; border-color: var(--blue); }
  .mi-input::placeholder { color: var(--muted); }

  .mi-btn { background: var(--blue-dim); color: var(--blue); border: 1.5px solid var(--blue); border-radius: 3px; padding: 8px 16px; font-family: inherit; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: all 0.15s; }
  .mi-btn:hover { background: var(--blue); color: var(--bg); }
  .mi-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .mi-btn.secondary { background: transparent; color: var(--muted); border-color: var(--border); }
  .mi-btn.secondary:hover { color: var(--text); border-color: var(--muted); }
  .mi-btn.danger { background: transparent; color: var(--red); border-color: var(--red); }
  .mi-btn.danger:hover { background: var(--red); color: var(--bg); }

  .mi-row { display: flex; gap: 8px; align-items: center; }
  .mi-row.grow > * { flex: 1; }

  .mi-player-list { display: flex; flex-direction: column; gap: 6px; }
  .mi-player { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel); border: 1.5px solid var(--border); border-radius: 3px; }
  .mi-player.disabled { opacity: 0.4; }
  .mi-player-check { width: 18px; height: 18px; cursor: pointer; accent-color: var(--blue); }
  .mi-player-name { flex: 1; font-size: 12px; font-weight: 600; }
  .mi-player-name input { background: transparent; border: none; color: var(--text); font-family: inherit; font-size: 12px; font-weight: 600; width: 100%; padding: 2px 4px; border-radius: 2px; }
  .mi-player-name input:focus { outline: none; background: var(--head); }
  .mi-player-team { font-size: 10px; color: var(--muted); font-family: monospace; min-width: 50px; text-align: right; }

  .mi-match-info { background: var(--panel); border: 1.5px solid var(--border); border-radius: 3px; padding: 12px 16px; margin-bottom: 1rem; }
  .mi-match-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .mi-match-meta { font-size: 11px; color: var(--muted); }

  .mi-status { padding: 12px 16px; border-radius: 3px; margin-bottom: 1rem; font-size: 12px; }
  .mi-status.error { background: rgba(220, 38, 38, 0.1); border: 1.5px solid var(--red); color: var(--red); }
  .mi-status.success { background: rgba(34, 197, 94, 0.1); border: 1.5px solid var(--green); color: var(--green); }
  .mi-status.loading { background: var(--panel); border: 1.5px solid var(--border); color: var(--muted); }

  .mi-hidden { display: none !important; }

  .mi-modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 100; display: flex; align-items: center; justify-content: center; }
  .mi-modal { background: var(--bg); border: 1.5px solid var(--border); border-radius: 6px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 1.5rem; }
  .mi-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .mi-modal-title { font-size: 14px; font-weight: 700; }
  .mi-modal-close { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .mi-modal-close:hover { color: var(--text); }

  .mi-diff-game { background: var(--panel); border: 1.5px solid var(--border); border-radius: 3px; padding: 12px; margin-bottom: 8px; }
  .mi-diff-game-header { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 8px; }
  .mi-diff-score { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .mi-diff-score:last-child { border-bottom: none; }
  .mi-diff-name { flex: 1; font-weight: 600; }
  .mi-diff-value { font-family: monospace; font-weight: 700; }
  .mi-diff-new { color: var(--green); }

  .mi-refresh-btn { background: transparent; color: var(--blue); border: 1.5px solid var(--blue); border-radius: 3px; padding: 4px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: all 0.15s; }
  .mi-refresh-btn:hover { background: var(--blue); color: var(--bg); }
  .mi-refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="mi-page">
  <div class="mi-topbar">
    <a href="/" class="logo" style="text-decoration:none">autoref</a>
    <span class="muted mono xs">mp import</span>
    <div style="flex:1"></div>
    <button class="ghost-btn" id="theme-toggle" title="toggle light/dark">◑</button>
    <a href="/" class="ghost-btn" style="text-decoration:none">stats</a>
  </div>

  <div id="mi-status" class="mi-status mi-hidden"></div>

  <div class="mi-section">
    <div class="mi-section-title">match link</div>
    <div class="mi-row">
      <input class="mi-input" id="mi-url" placeholder="https://osu.ppy.sh/mp/123456 or https://osu.ppy.sh/community/matches/123456">
      <button class="mi-btn" id="mi-preview">preview</button>
    </div>
  </div>

  <div id="mi-preview-section" class="mi-hidden">
    <div class="mi-match-info">
      <div class="mi-match-name" id="mi-match-name">—</div>
      <div class="mi-match-meta" id="mi-match-meta">—</div>
    </div>

    <div class="mi-section">
      <div class="mi-section-title">players <span class="mono xs" style="color:var(--muted);margin-left:6px">uncheck to exclude</span></div>
      <div class="mi-player-list" id="mi-player-list"></div>
    </div>

    <div class="mi-section">
      <div class="mi-section-title">metadata <span class="mono xs" style="color:var(--muted);margin-left:6px">optional</span></div>
      <div class="mi-row" style="margin-bottom:8px">
        <input class="mi-input" id="mi-pool" placeholder="pool id (e.g. finals)">
        <input class="mi-input" id="mi-round" placeholder="round (e.g. ro16)">
      </div>
    </div>

    <div class="mi-row">
      <button class="mi-btn secondary" id="mi-cancel">cancel</button>
      <button class="mi-btn" id="mi-import" style="flex:1">import match</button>
    </div>
  </div>

  <div class="mi-section">
    <div class="mi-section-title">imported matches</div>
    <div id="mi-imported-list" style="display:flex;flex-direction:column;gap:6px">
      <div class="mi-status loading">loading...</div>
    </div>
  </div>
</div>
<script type="module" src="/static/mp_import.js"></script>
</body>
</html>
