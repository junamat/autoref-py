<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>autoref</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { overflow-y: auto; height: auto; min-height: 100vh; }
  #hub-page { max-width: 480px; margin: 0 auto; padding: 2rem 1rem; }
  #hub-topbar { display:flex; align-items:center; gap:1rem; margin-bottom:3rem; }
  #hub-topbar #nav-links { display:flex; gap:0.5rem; align-items:center; }
  #hub-hero { margin-bottom: 2.5rem; }
  #hub-hero h1 { font-size: 1rem; font-weight: 700; margin: 0 0 0.4rem; }
  #hub-hero p  { font-size: 0.8rem; color: var(--muted, #888); margin: 0; }
  #hub-cards { display: flex; flex-direction: column; gap: 0.75rem; }
  .hub-card {
    display: flex; align-items: center; gap: 1rem;
    border: 1px solid var(--border, #333); border-radius: 6px;
    padding: 0.85rem 1rem; text-decoration: none; color: inherit;
    transition: border-color 0.15s;
  }
  .hub-card:hover { border-color: var(--accent, #fff); }
  .hub-card-icon { font-size: 1.1rem; width: 1.5rem; text-align: center; flex-shrink: 0; }
  .hub-card-body { flex: 1; }
  .hub-card-title { font-size: 0.9rem; font-weight: 700; margin: 0 0 0.2rem; }
  .hub-card-desc  { font-size: 0.75rem; color: var(--muted, #888); margin: 0; }
</style>
</head>
<body>
<div id="hub-page">
  <div id="hub-topbar">
    <span class="logo">autoref</span>
    <div style="flex:1"></div>
    <button class="ghost-btn" id="theme-toggle" title="toggle light/dark">◑</button>
    <div id="nav-links"></div>
  </div>

  <div id="hub-hero">
    <h1 class="mono">osu! tournament autoref</h1>
    <p class="mono">self-hosted referee for bancho lobbies</p>
  </div>

  <div id="hub-cards">
    <a href="/stats" class="hub-card" id="card-stats">
      <div class="hub-card-icon">📊</div>
      <div class="hub-card-body">
        <div class="hub-card-title mono">stats</div>
        <div class="hub-card-desc mono">leaderboards, match results, plots</div>
      </div>
    </a>
    <a href="/ref" class="hub-card" id="card-ref" style="display:none">
      <div class="hub-card-icon">🎮</div>
      <div class="hub-card-body">
        <div class="hub-card-title mono">ref dashboard</div>
        <div class="hub-card-desc mono">active matches, orphan recovery, match control</div>
      </div>
    </a>
    <a href="/pool-builder" class="hub-card" id="card-pool" style="display:none">
      <div class="hub-card-icon">🗺</div>
      <div class="hub-card-body">
        <div class="hub-card-title mono">pool builder</div>
        <div class="hub-card-desc mono">build and manage map pools</div>
      </div>
    </a>
    <a href="/settings" class="hub-card" id="card-settings" style="display:none">
      <div class="hub-card-icon">⚙</div>
      <div class="hub-card-body">
        <div class="hub-card-title mono">settings</div>
        <div class="hub-card-desc mono">server config, IRC credentials, timers</div>
      </div>
    </a>
  </div>
</div>
<script type="module">
import { initNav } from '/static/shared/nav.js';
initNav({ active: null }).then(({ role }) => {
  const isPriv = role === 'host' || role === 'ref';
  if (isPriv) {
    document.getElementById('card-ref').style.display = '';
    document.getElementById('card-pool').style.display = '';
    document.getElementById('card-settings').style.display = '';
  }
});
</script>
</body>
</html>
