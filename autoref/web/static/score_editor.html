<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>autoref — score editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { overflow-y: auto; height: auto; min-height: 100vh; }
  .se-page { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
  .se-topbar { display:flex; align-items:center; gap:1rem; margin-bottom:2rem; flex-wrap:wrap; }

  .se-section { margin-bottom: 1.5rem; }
  .se-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }

  .se-input { background: var(--head); color: var(--text); border: 1.5px solid var(--border); border-radius: 3px; padding: 8px 12px; font-family: inherit; font-size: 12px; width: 100%; box-sizing: border-box; }
  .se-input:focus { outline: none; border-color: var(--blue); }
  .se-input::placeholder { color: var(--muted); }

  .se-btn { background: var(--blue-dim); color: var(--blue); border: 1.5px solid var(--blue); border-radius: 3px; padding: 8px 16px; font-family: inherit; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: all 0.15s; }
  .se-btn:hover { background: var(--blue); color: var(--bg); }
  .se-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .se-btn.secondary { background: transparent; color: var(--muted); border-color: var(--border); }
  .se-btn.secondary:hover { color: var(--text); border-color: var(--muted); }
  .se-btn.danger { background: transparent; color: var(--red); border-color: var(--red); }
  .se-btn.danger:hover { background: var(--red); color: var(--bg); }
  .se-btn.small { padding: 4px 10px; font-size: 10px; }

  .se-row { display: flex; gap: 8px; align-items: center; }
  .se-row.grow > * { flex: 1; }
  .se-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }

  .se-score-list { display: flex; flex-direction: column; gap: 6px; }
  .se-score { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel); border: 1.5px solid var(--border); border-radius: 3px; }
  .se-score-info { flex: 1; font-size: 12px; }
  .se-score-name { font-weight: 600; }
  .se-score-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .se-score-value { font-size: 14px; font-weight: 700; font-family: monospace; min-width: 80px; text-align: right; }

  .se-status { padding: 12px 16px; border-radius: 3px; margin-bottom: 1rem; font-size: 12px; }
  .se-status.error { background: rgba(220, 38, 38, 0.1); border: 1.5px solid var(--red); color: var(--red); }
  .se-status.success { background: rgba(34, 197, 94, 0.1); border: 1.5px solid var(--green); color: var(--green); }
  .se-status.loading { background: var(--panel); border: 1.5px solid var(--border); color: var(--muted); }

  .se-hidden { display: none !important; }

  .se-form-section { background: var(--panel); border: 1.5px solid var(--border); border-radius: 3px; padding: 16px; margin-bottom: 1rem; }
  .se-form-title { font-size: 12px; font-weight: 700; margin-bottom: 12px; color: var(--text); }
  .se-form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .se-form-field { display: flex; flex-direction: column; gap: 4px; }
  .se-form-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  .se-warning { background: rgba(234, 179, 8, 0.1); border: 1.5px solid #eab308; color: #eab308; padding: 12px 16px; border-radius: 3px; margin-bottom: 1rem; font-size: 12px; }
</style>
</head>
<body>
<div class="se-page">
  <div class="se-topbar">
    <a href="/" class="logo" style="text-decoration:none">autoref</a>
    <span class="muted mono xs">score editor</span>
    <div style="flex:1"></div>
    <button class="ghost-btn" id="theme-toggle" title="toggle light/dark">◑</button>
    <a href="/" class="ghost-btn" style="text-decoration:none">stats</a>
  </div>

  <div class="se-warning">
    <strong>admin only</strong> — changes here affect stats and cannot be easily undone.
  </div>

  <div id="se-status" class="se-status se-hidden"></div>

  <div class="se-section">
    <div class="se-section-title">load match</div>
    <div class="se-row">
      <input class="se-input" id="se-match-id" type="number" placeholder="match id (e.g. 42)">
      <button class="se-btn" id="se-load">load</button>
    </div>
  </div>

  <div id="se-scores-section" class="se-hidden">
    <div class="se-section">
      <div class="se-section-title">scores <span class="mono xs" style="color:var(--muted);margin-left:6px" id="se-match-info"></span></div>
      <div class="se-score-list" id="se-score-list"></div>
    </div>

    <div class="se-section">
      <div class="se-section-title">add simulated score</div>
      <div class="se-form-section">
        <div class="se-form-grid">
          <div class="se-form-field">
            <label class="se-form-label">user id</label>
            <input class="se-input" id="se-new-user-id" type="number" placeholder="12345">
          </div>
          <div class="se-form-field">
            <label class="se-form-label">username</label>
            <input class="se-input" id="se-new-username" placeholder="player name">
          </div>
          <div class="se-form-field">
            <label class="se-form-label">turn</label>
            <input class="se-input" id="se-new-turn" type="number" placeholder="1" value="1">
          </div>
          <div class="se-form-field">
            <label class="se-form-label">beatmap id</label>
            <input class="se-input" id="se-new-beatmap" type="number" placeholder="123456">
          </div>
          <div class="se-form-field">
            <label class="se-form-label">team index</label>
            <input class="se-input" id="se-new-team" type="number" placeholder="0" value="0">
          </div>
          <div class="se-form-field">
            <label class="se-form-label">score</label>
            <input class="se-input" id="se-new-score" type="number" placeholder="1000000">
          </div>
          <div class="se-form-field">
            <label class="se-form-label">accuracy</label>
            <input class="se-input" id="se-new-acc" type="number" step="0.01" placeholder="98.5">
          </div>
          <div class="se-form-field">
            <label class="se-form-label">max combo</label>
            <input class="se-input" id="se-new-combo" type="number" placeholder="500">
          </div>
          <div class="se-form-field">
            <label class="se-form-label">misses</label>
            <input class="se-input" id="se-new-miss" type="number" placeholder="0" value="0">
          </div>
          <div class="se-form-field">
            <label class="se-form-label">rank</label>
            <input class="se-input" id="se-new-rank" placeholder="S">
          </div>
          <div class="se-form-field">
            <label class="se-form-label">mods (comma-sep)</label>
            <input class="se-input" id="se-new-mods" placeholder="HD,DT">
          </div>
          <div class="se-form-field">
            <label class="se-form-label">passed</label>
            <select class="se-input" id="se-new-passed">
              <option value="true">yes</option>
              <option value="false">no</option>
            </select>
          </div>
        </div>
        <div style="margin-top: 12px; display: flex; gap: 8px;">
          <button class="se-btn" id="se-add-score" style="flex:1">add score</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/static/score_editor.js"></script>
</body>
</html>
